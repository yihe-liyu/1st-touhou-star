name: verify

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: 一键验证（语法 + 启动 + GUT 全量）
        run: |
          ./tools/verify.sh res://scenes/game_scene.tscn
